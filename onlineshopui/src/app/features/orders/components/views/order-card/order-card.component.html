<app-card [hoverable]="true">
    <div class="flex flex-col gap-4">
        <div class="flex items-start justify-between">
            <div>
                <div class="text-sm text-text-muted">{{ 'orders.labels.order' | transloco }}</div>
                <div class="text-lg font-semibold text-text">{{ order().id }}</div>
            </div>
            <div class="text-sm text-text-muted">{{ date() }}</div>
        </div>

        <div class="flex items-center justify-between">
            <div class="text-text-muted text-sm">{{ 'orders.labels.items' | transloco }}</div>
            <div class="text-text">{{ order().totalItems }}</div>
        </div>

        <div class="flex items-center justify-between">
            <div class="text-text-muted text-sm">{{ 'orders.labels.total' | transloco }}</div>
            <div class="text-xl font-semibold text-text">{{ total() }}</div>
        </div>

        <button
            type="button"
            (click)="onViewDetails()"
            class="w-full px-4 py-2 rounded-md border border-border text-text hover:bg-surface-2 transition-colors"
        >
            {{ 'orders.actions.viewDetails' | transloco }}
        </button>
    </div>
</app-card>
