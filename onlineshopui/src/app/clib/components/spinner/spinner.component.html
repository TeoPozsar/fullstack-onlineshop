@if (overlay()) {
    <div
        class="fixed inset-0 bg-black/50 dark:bg-black/70 flex items-center justify-center z-50"
        role="status"
        [attr.aria-label]="'common.loading' | transloco"
    >
        <div
            class="animate-spin rounded-full border-4 border-border border-t-primary {{
                sizeClass()
            }}"
        ></div>
    </div>
} @else {
    <div class="flex items-center justify-center" role="status" [attr.aria-label]="'common.loading' | transloco">
        <div
            class="animate-spin rounded-full border-4 border-border border-t-primary {{
                sizeClass()
            }}"
        ></div>
    </div>
}
